<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>delivery feasibility</title></head>
<body style="margin:0;background:#000">
<canvas id="c"></canvas>
<script src="/node_modules/onnxruntime-web/dist/ort.min.js"></script>
<script src="/yolo-detector.js"></script>
<script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';

// Feasibility probe for tracking a delivery: a bowl rolling away down a full
// length of green, rendered from where somebody would actually stand, and put
// through two quite different ways of finding it.
//
// The question this exists to answer is not "can we detect a bowl" — we know
// we can, close up — but "can anything find it once it is two pixels across",
// which is what a bowl at the far end of a rink actually is. The detector
// needs something that looks like an object; frame differencing only needs
// something that moved, and does not care how small it is. Which of those
// holds up, and out to what distance, decides whether a trajectory feature is
// worth attempting at all.

ort.env.wasm.wasmPaths = '/node_modules/onnxruntime-web/dist/';
ort.env.wasm.numThreads = 1;

const BOWL_RADIUS_M = 0.0625;
const JACK_RADIUS_M = 0.0315;

let state = null;

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function makeTurfTexture(seed, size) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const rand = mulberry32(seed);
  const image = ctx.createImageData(size, size);
  for (let i = 0; i < image.data.length; i += 4) {
    const shade = 58 + rand() * 48;
    image.data[i] = shade * 0.45;
    image.data[i + 1] = shade;
    image.data[i + 2] = shade * 0.4;
    image.data[i + 3] = 255;
  }
  ctx.putImageData(image, 0, 0);
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(30, 60);
  return texture;
}

window.buildGreen = function (config) {
  const canvas = document.getElementById('c');
  canvas.width = config.width;
  canvas.height = config.height;

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(1);
  renderer.setSize(config.width, config.height, false);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9fb8c8); // pale sky, so the horizon reads

  const green = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 80),
    new THREE.MeshStandardMaterial({ map: makeTurfTexture(7, 256), roughness: 1 })
  );
  green.rotation.x = -Math.PI / 2;
  scene.add(green);

  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const sun = new THREE.DirectionalLight(0xffffff, 0.9);
  sun.position.set(3, 6, 2);
  scene.add(sun);

  // The jack, sitting up the green where the head will form.
  const jack = new THREE.Mesh(
    new THREE.SphereGeometry(JACK_RADIUS_M, 24, 16),
    new THREE.MeshStandardMaterial({ color: 0xf2efe4, roughness: 0.4 })
  );
  jack.position.set(config.jack.x, JACK_RADIUS_M, config.jack.z);
  scene.add(jack);

  // The bowl in flight.
  const bowl = new THREE.Mesh(
    new THREE.SphereGeometry(BOWL_RADIUS_M, 32, 24),
    new THREE.MeshStandardMaterial({ color: 0x1b1b1b, roughness: 0.35 })
  );
  bowl.position.set(0, BOWL_RADIUS_M, 0);
  scene.add(bowl);

  const camera = new THREE.PerspectiveCamera(config.fov, config.width / config.height, 0.05, 200);
  camera.position.set(config.camera.x, config.camera.y, config.camera.z);
  camera.lookAt(config.camera.tx, config.camera.ty, config.camera.tz);
  camera.updateMatrixWorld();

  const letterbox = document.createElement('canvas');
  letterbox.width = letterbox.height = LawnBowlsYolo.INPUT_SIZE;
  const grey = document.createElement('canvas');
  grey.width = config.width; grey.height = config.height;

  state = { renderer, scene, camera, bowl, config, letterbox, grey, previousGrey: null };
  return { ok: true };
};

// Greyscale copy of the current render, for comparing one frame against the
// next. A bowl is the only thing on a green that moves, which is what makes
// this worth trying where the detector cannot help.
function greyscaleOfRender() {
  const { grey, config, renderer } = state;
  const ctx = grey.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(renderer.domElement, 0, 0);
  const data = ctx.getImageData(0, 0, config.width, config.height).data;
  const out = new Uint8Array(config.width * config.height);
  for (let i = 0, p = 0; i < data.length; i += 4, p++) {
    out[p] = (data[i] * 77 + data[i + 1] * 150 + data[i + 2] * 29) >> 8;
  }
  return out;
}

// Largest patch of the frame that changed since the last one, as a
// brightness-weighted centroid. No connected-component labelling: the only
// thing moving in these frames is the bowl, so the heaviest cluster of change
// is it. Real footage would need the player's own movement excluded.
function largestChange(current, previous, width, height, threshold) {
  if (!previous) return null;
  let sum = 0, sx = 0, sy = 0, peak = 0, count = 0;
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const i = y * width + x;
      const diff = Math.abs(current[i] - previous[i]);
      if (diff < threshold) continue;
      sum += diff; sx += x * diff; sy += y * diff; count++;
      if (diff > peak) peak = diff;
    }
  }
  if (!count) return null;
  return { x: sx / sum, y: sy / sum, pixels: count, peak };
}

// Where a pixel meets the green, given the camera's true pose. This is the
// same idea as ground.js's rayToPlane, but with the plane known outright
// rather than fitted from bowls — which is the point: a bowl in flight is
// alone on the green, so there is nothing to fit a plane from, and the
// orientation has to come from somewhere else. A phone knows which way is
// down, so in practice it would come from gravity.
function pixelToGreen(px, py) {
  const { camera, config } = state;
  const ndc = new THREE.Vector3(
    (px / config.width) * 2 - 1,
    -((py / config.height) * 2 - 1),
    0.5
  );
  ndc.unproject(camera);
  const origin = camera.position.clone();
  const dir = ndc.sub(origin).normalize();
  if (Math.abs(dir.y) < 1e-6) return null;
  // Intersect with the plane through the bowl's centre height, since that is
  // what is being seen — not the grass itself.
  const t = (BOWL_RADIUS_M - origin.y) / dir.y;
  if (t <= 0) return null;
  return { x: origin.x + dir.x * t, z: origin.z + dir.z * t };
}

window.runDelivery = async function (path, opts) {
  const { config, letterbox, camera } = state;
  const lctx = letterbox.getContext('2d', { willReadFrequently: true });
  const session = await ort.InferenceSession.create('/models/yolov8n.onnx', { executionProviders: ['wasm'] });

  state.previousGrey = null;
  const frames = [];

  for (const step of path) {
    state.bowl.position.set(step.x, BOWL_RADIUS_M, step.z);
    state.renderer.render(state.scene, camera);

    // Where the bowl truly is on screen, from three.js's own projection.
    const centre = state.bowl.position.clone().project(camera);
    const truth = {
      x: (centre.x + 1) * config.width / 2,
      y: (1 - centre.y) * config.height / 2,
    };
    const distance = camera.position.distanceTo(state.bowl.position);
    const trueRadiusPx = (config.height / 2) / Math.tan(config.fov * Math.PI / 360) * BOWL_RADIUS_M / distance;

    // --- the detector ---
    const box = LawnBowlsYolo.computeLetterbox(config.width, config.height, LawnBowlsYolo.INPUT_SIZE);
    lctx.fillStyle = 'rgb(114,114,114)';
    lctx.fillRect(0, 0, LawnBowlsYolo.INPUT_SIZE, LawnBowlsYolo.INPUT_SIZE);
    lctx.drawImage(state.renderer.domElement, box.padX, box.padY, box.newWidth, box.newHeight);
    const detected = await LawnBowlsYolo.detectAndRank(
      ort, session, lctx.getImageData(0, 0, LawnBowlsYolo.INPUT_SIZE, LawnBowlsYolo.INPUT_SIZE), box);

    let nearest = null;
    for (const d of detected.detections) {
      const off = Math.hypot(d.x - truth.x, d.y - truth.y);
      if (!nearest || off < nearest.off) nearest = { off, d };
    }
    const detectorFound = nearest && nearest.off < Math.max(trueRadiusPx * 3, 10);

    // --- frame differencing ---
    const grey = greyscaleOfRender();
    const change = largestChange(grey, state.previousGrey, config.width, config.height, opts.diffThreshold);
    state.previousGrey = grey;
    const changeOff = change ? Math.hypot(change.x - truth.x, change.y - truth.y) : null;
    const changeFound = change && changeOff < Math.max(trueRadiusPx * 3, 10);

    // --- what either would give as a position on the green ---
    const fromDetector = detectorFound ? pixelToGreen(nearest.d.x, nearest.d.y) : null;
    const fromChange = changeFound ? pixelToGreen(change.x, change.y) : null;

    frames.push({
      trueX: step.x, trueZ: step.z, distance,
      trueRadiusPx,
      screenY: truth.y,
      detections: detected.detections.length,
      detectorFound: !!detectorFound,
      detectorOffPx: nearest ? nearest.off : null,
      changePixels: change ? change.pixels : 0,
      changeFound: !!changeFound,
      changeOffPx: changeOff,
      groundErrorDetector: fromDetector
        ? Math.hypot(fromDetector.x - step.x, fromDetector.z - step.z) : null,
      groundErrorChange: fromChange
        ? Math.hypot(fromChange.x - step.x, fromChange.z - step.z) : null,
      lateralErrorChange: fromChange ? Math.abs(fromChange.x - step.x) : null,
      alongErrorChange: fromChange ? Math.abs(fromChange.z - step.z) : null,
    });
  }

  return { frames };
};

window.__deliveryReady = true;
</script>
</body>
</html>
