<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lawn Bowls Scorer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="hud">
    <div id="status">Loading…</div>
    <div id="controls">
      <button id="scanBtn" hidden>Stop Scan</button>
      <button id="registerBtn" disabled>Register Player</button>
    </div>
    <ul id="ranking"></ul>

    <h3>Registered players</h3>
    <ul id="registry"></ul>
  </div>

  <div id="pickerModal" hidden>
    <h3>Select this player's bowls</h3>
    <p id="pickerHint">Point the camera at their bowls — new ones appear up top as they're seen.</p>
    <div id="pickerGrid"></div>
    <div id="pickerControls">
      <button id="pickerConfirm">Confirm</button>
      <button id="pickerCancel">Cancel</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.29.0/dist/ort.min.js"></script>
  <script src="detection.js"></script>
  <script src="yolo-detector.js"></script>
  <script src="embedding.js"></script>
  <script src="registry.js"></script>
  <script src="slam.js"></script>
  <script src="app.js"></script>
</body>
</html>
